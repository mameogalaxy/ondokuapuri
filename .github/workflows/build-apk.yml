name: Build Android APK

# よみたまのAndroid APKを自動ビルドし、誰でも試せるように
# GitHub Releases（タグ: android-latest）へ公開します。
# 試す人はリリースページからAPKをダウンロードしてインストールするだけです。

on:
  push:
    branches:
      - main
      - claude/yomitama-pet-reading-app-z6f8fm
  workflow_dispatch: # 手動実行も可能

permissions:
  contents: write # Releaseの作成・更新に必要

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Java をセットアップ
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter をセットアップ
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android ネイティブ雛形を生成
        # このリポジトリには lib/ と権限設定の見本のみを含むため、
        # gradle 等の雛形を CI で生成します（lib/ と pubspec.yaml は保持されます）。
        run: flutter create . --platforms=android --org com.example.yomitama --project-name yomitama

      - name: 権限設定(AndroidManifest)を再適用
        # flutter create が上書きした Manifest を、リポジトリの見本（録音・カメラ権限つき）に戻します。
        run: git checkout -- android/app/src/main/AndroidManifest.xml

      - name: 依存を取得
        run: flutter pub get

      - name: APK をビルド（release / デフォルト署名）
        run: flutter build apk --release

      - name: APK をアーティファクトとして保存
        uses: actions/upload-artifact@v4
        with:
          name: yomitama-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Release に公開（タグ: android-latest）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: よみたま Android (最新ビルド)
          body: |
            「よみたま」を Android で試せる最新APKです。
            下の `app-release.apk` をAndroid端末にダウンロードしてインストールしてください。
            （提供元不明のアプリのインストール許可が必要な場合があります）
          files: build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
